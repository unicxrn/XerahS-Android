name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release
        env:
          XERAHS_KEYSTORE: ${{ runner.temp }}/release.keystore
          XERAHS_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          XERAHS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XERAHS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "Signer SHA-256: $SHA"
          test "$SHA" = "4de66000cb45bc6a9932f6b12b1bdd610dcd84486183d1af7f8cdb33cb9db525"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="XerahS-${GITHUB_REF_NAME#v}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "XerahS ${GITHUB_REF_NAME#v}" "$APK"
          fi
